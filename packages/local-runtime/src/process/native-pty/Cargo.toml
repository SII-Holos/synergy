[package]
name = "synergy-pty"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
portable-pty = "=0.9.0"

[target.'cfg(windows)'.dependencies]
portable-pty = "=0.8.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
strip = true
