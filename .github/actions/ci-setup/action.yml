name: CI environment
description: Install the prerequisites declared by an execution unit
inputs:
  dependencies:
    description: Install workspace dependencies
    default: "true"
  browser:
    description: Install browser test dependencies
    default: "false"
  desktop:
    description: Install Desktop packaging and smoke dependencies
    default: "false"
  sandbox:
    description: Enable real Linux sandbox tests with the verified helper
    default: "false"
  policy:
    description: Install secret scanning tools
    default: "false"
  native:
    description: Cache Rust dependencies and compilation for native builders
    default: "false"
  build-cache:
    description: Restore Rust compilation caches
    default: "true"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.4.2"
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        version: "0.9.2"
        enable-cache: true
        cache-dependency-glob: benchmark/uv.lock
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: inputs.dependencies == 'true'
      with:
        path: ~/.bun/install/cache
        key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock') }}
        restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-1.4.2-
    - name: Native compiler identity
      if: inputs.native == 'true' && inputs.build-cache == 'true'
      id: rust-key
      shell: bash
      run: |
        identity=$(rustc -vV | bun -e 'console.log(new Bun.CryptoHasher("sha256").update(await Bun.stdin.text()).digest("hex"))')
        echo "identity=$identity" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: inputs.native == 'true' && inputs.build-cache == 'true'
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          packages/local-runtime/src/process/native-pty/target
          packages/local-runtime/src/sandbox/helper/target
          packages/local-runtime/src/sandbox/helper-linux/target
        key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ steps.rust-key.outputs.identity }}-${{ hashFiles('packages/local-runtime/src/process/native-pty/**', 'packages/local-runtime/src/sandbox/helper/**', 'packages/local-runtime/src/sandbox/helper-linux/**') }}
    - if: inputs.dependencies == 'true'
      shell: bash
      env:
        HUSKY: "0"
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      run: bun install --frozen-lockfile
    - name: Test Git identity
      shell: bash
      run: |
        git config --global user.email "ci@synergy.dev"
        git config --global user.name "CI Runner"
    - if: inputs.browser == 'true'
      shell: bash
      run: bun run --cwd apps/web playwright install --with-deps chromium
    - if: inputs.desktop == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libarchive-tools rpm libgtk-3-0 libnss3 libxss1 libxtst6 libatspi2.0-0 libgbm1 libasound2t64
        node apps/desktop/node_modules/electron/install.js
    - if: runner.os == 'Linux' && inputs.dependencies == 'true'
      shell: bash
      run: |
        if ! command -v rg >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y ripgrep
        fi
    - if: inputs.sandbox == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap apparmor
        cat <<'PROFILE' | sudo tee /etc/apparmor.d/synergy-bwrap
        abi <abi/4.0>,
        include <tunables/global>
        profile synergy-bwrap /usr/bin/bwrap flags=(unconfined) {
          userns,
          include if exists <local/bwrap>
        }
        PROFILE
        sudo apparmor_parser -r /etc/apparmor.d/synergy-bwrap
        mkdir -p packages/local-runtime/src/sandbox/helper-linux/target/release
        install -m 0755 packages/local-runtime/sandbox-assets/linux-x64/synergy-sandbox-linux packages/local-runtime/src/sandbox/helper-linux/target/release/synergy-sandbox-linux
        mkdir -p "$HOME/.synergy/sandbox-helper"
        install -m 0755 packages/local-runtime/sandbox-assets/linux-x64/synergy-sandbox-linux "$HOME/.synergy/sandbox-helper/synergy-sandbox-linux"
    - if: inputs.policy == 'true'
      shell: bash
      run: |
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
        (cd "$RUNNER_TEMP" && echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -)
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
        sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
