# Provenance: https://github.com/YourTongji/YourTJ-Hub/tree/4ec17d4ddf9910b59c9f67442f2bbc35f0b9d1e4/.github
# Local adaptation: run Oryn in Synergy Actions with Bun workspace validation and repository-scoped App tokens.
name: Set up pinned Oryn
description: Fetch the trusted Oryn runtime and apply this repository's operator policy.
inputs:
  client-id:
    required: true
    description: GitHub App client ID
  private-key:
    required: true
    description: GitHub App private key
runs:
  using: composite
  steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      id: source
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: yzxoi
        repositories: oryn-mini
        permission-contents: read
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: yzxoi/oryn-mini
        ref: 775ff40758ffb18ae67e9fdbbf0a335fb447aeaf
        token: ${{ steps.source.outputs.token }}
        path: .oryn-runtime
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
    - shell: bash
      working-directory: .oryn-runtime
      run: |
        cp ../.github/oryn/repositories.json config/repositories.json
        bun install --frozen-lockfile
