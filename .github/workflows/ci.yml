name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  HUSKY: "0"

jobs:
  plan:
    name: Verification plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      mode: ${{ steps.plan.outputs.mode }}
      build: ${{ steps.plan.outputs.build }}
      sandbox: ${{ steps.plan.outputs.sandbox }}
      benchmark: ${{ steps.plan.outputs.benchmark }}
      contracts: ${{ steps.plan.outputs.contracts }}
      contracts_count: ${{ steps.plan.outputs.contracts_count }}
      docker-external: ${{ steps.plan.outputs.docker-external }}
      docker-external_count: ${{ steps.plan.outputs.docker-external_count }}
      docker-ready: ${{ steps.plan.outputs.docker-ready }}
      docker-ready_count: ${{ steps.plan.outputs.docker-ready_count }}
      linux: ${{ steps.plan.outputs.linux }}
      linux_count: ${{ steps.plan.outputs.linux_count }}
      docker: ${{ steps.plan.outputs.docker }}
      docker_count: ${{ steps.plan.outputs.docker_count }}
      postgres: ${{ steps.plan.outputs.postgres }}
      postgres_count: ${{ steps.plan.outputs.postgres_count }}
      windows: ${{ steps.plan.outputs.windows }}
      windows_count: ${{ steps.plan.outputs.windows_count }}
      macos: ${{ steps.plan.outputs.macos }}
      macos_count: ${{ steps.plan.outputs.macos_count }}
      diagnostic: ${{ steps.plan.outputs.diagnostic }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - name: Load admission evidence when affected mode is requested
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FORCE_FULL: ${{ vars.SYNERGY_CI_FORCE_FULL }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$CI_FORCE_FULL" != 1 ] && [ "$(bun -e 'console.log((await Bun.file("script/ci/rollout.json").json()).mode)')" = affected ]; then
            bun script/ci.ts history
          fi
      - name: Resolve exact revisions and plan
        id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          CI_FORCE_FULL: ${{ vars.SYNERGY_CI_FORCE_FULL }}
        run: |
          tested="$(git rev-parse HEAD)"
          base="${PR_BASE:-${PUSH_BASE:-}}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          args=(--base "$base" --head "${PR_HEAD:-$tested}" --sha "$tested")
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$CI_FORCE_FULL" = 1 ]; then
            args+=(--mode full)
          fi
          bun script/ci.ts plan "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci/plan.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  prepare:
    name: Verified Linux build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      cache_hit: ${{ steps.cache.outputs.cache-hit }}
    env:
      SYNERGY_CI_SANDBOX_BUNDLE: ${{ needs.plan.outputs.sandbox }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - name: Resolve build toolchain identity
        id: build-key
        run: bun script/ci.ts build-key
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        if: github.event_name != 'schedule'
        with:
          path: .artifacts/ci/build
          key: ci-build-${{ steps.build-key.outputs.key }}
      - name: Build or validate cached outputs
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            bun script/ci.ts restore
          else
            bun script/ci.ts prepare
          fi
          tar -cf .artifacts/ci/build.tar -C .artifacts/ci build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-build-${{ github.run_attempt }}
          path: .artifacts/ci/build.tar
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  benchmark-prepare:
    name: Frozen benchmark preparation
    needs: plan
    if: needs.plan.outputs.benchmark == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci
      - uses: ./.github/actions/ci-setup
        with:
          dependencies: "false"
      - run: bun script/ci.ts run --unit benchmark-prepare
      - run: tar -I 'zstd -T2 -3' -cf .artifacts/ci/benchmark.tar.zst -C .artifacts/ci benchmark/prepared
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-benchmark-prepared-${{ github.run_attempt }}
          path: .artifacts/ci/benchmark.tar.zst
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-benchmark-prepare-${{ github.run_attempt }}
          path: .artifacts/ci/results
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  contracts:
    name: contracts (${{ matrix.id }})
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.contracts_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.contracts) }}
    env:
      SYNERGY_CI_SANDBOX_BUNDLE: ${{ needs.plan.outputs.sandbox }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: ./.github/actions/ci-setup
        with:
          dependencies: "true"
          browser: ${{ matrix.browser }}
          desktop: ${{ matrix.desktop }}
          sandbox: ${{ matrix.sandbox }}
          policy: ${{ matrix.policy }}
      - name: Execute planned tasks
        env:
          CI_UNIT: ${{ matrix.id }}
        run: bun script/ci.ts run --unit "$CI_UNIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-${{ matrix.id }}-${{ github.run_attempt }}
          path: .artifacts/ci/results
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  linux:
    name: linux (${{ matrix.id }})
    needs: [plan, prepare]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.linux_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux) }}
    env:
      SYNERGY_CI_SANDBOX_BUNDLE: ${{ needs.plan.outputs.sandbox }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.build
        with:
          name: ci-build-${{ github.run_attempt }}
          path: .artifacts/ci
      - name: Verify shared build
        if: matrix.build
        shell: bash
        run: |
          tar -xf .artifacts/ci/build.tar -C .artifacts/ci
          bun script/ci.ts restore
      - uses: ./.github/actions/ci-setup
        with:
          dependencies: "true"
          browser: ${{ matrix.browser }}
          desktop: ${{ matrix.desktop }}
          sandbox: ${{ matrix.sandbox }}
          policy: ${{ matrix.policy }}
      - name: Execute planned tasks
        env:
          CI_UNIT: ${{ matrix.id }}
        run: bun script/ci.ts run --unit "$CI_UNIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-${{ matrix.id }}-${{ github.run_attempt }}
          path: .artifacts/ci/results
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  docker-external:
    name: docker-external (${{ matrix.id }})
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.docker-external_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.docker-external) }}
    env:
      SYNERGY_CI_SANDBOX_BUNDLE: ${{ needs.plan.outputs.sandbox }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: ./.github/actions/ci-setup
        with:
          dependencies: "false"
          browser: ${{ matrix.browser }}
          desktop: ${{ matrix.desktop }}
          sandbox: ${{ matrix.sandbox }}
          policy: ${{ matrix.policy }}
      - name: Execute planned tasks
        env:
          CI_UNIT: ${{ matrix.id }}
        run: bun script/ci.ts run --unit "$CI_UNIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-${{ matrix.id }}-${{ github.run_attempt }}
          path: .artifacts/ci/results
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Collect bounded benchmark evidence
        if: always()
        run: python3 benchmark/src/synergy_bench/ci_evidence.py integration parent-death compaction-integration oom-integration matrix-integration --output "$RUNNER_TEMP/benchmark-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-evidence-${{ matrix.id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-evidence
          include-hidden-files: true
          retention-days: 7
  docker-ready:
    name: docker-ready (${{ matrix.id }})
    needs: [plan, benchmark-prepare]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.docker-ready_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.docker-ready) }}
    env:
      SYNERGY_CI_SANDBOX_BUNDLE: ${{ needs.plan.outputs.sandbox }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: contains(matrix.tasks, 'native-synergy') || contains(matrix.tasks, 'benchmark-docker-normal') || contains(matrix.tasks, 'benchmark-docker-faults')
        with:
          name: ci-benchmark-prepared-${{ github.run_attempt }}
          path: .artifacts/ci
      - name: Unpack read-only benchmark input
        if: contains(matrix.tasks, 'native-synergy') || contains(matrix.tasks, 'benchmark-docker-normal') || contains(matrix.tasks, 'benchmark-docker-faults')
        shell: bash
        run: tar --zstd -xf .artifacts/ci/benchmark.tar.zst -C .artifacts/ci
      - uses: ./.github/actions/ci-setup
        with:
          dependencies: "false"
          browser: ${{ matrix.browser }}
          desktop: ${{ matrix.desktop }}
          sandbox: ${{ matrix.sandbox }}
          policy: ${{ matrix.policy }}
      - name: Execute planned tasks
        env:
          CI_UNIT: ${{ matrix.id }}
        run: bun script/ci.ts run --unit "$CI_UNIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-${{ matrix.id }}-${{ github.run_attempt }}
          path: .artifacts/ci/results
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Collect bounded benchmark evidence
        if: always()
        run: python3 benchmark/src/synergy_bench/ci_evidence.py integration parent-death compaction-integration oom-integration matrix-integration --output "$RUNNER_TEMP/benchmark-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-evidence-${{ matrix.id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-evidence
          include-hidden-files: true
          retention-days: 7
  docker:
    name: docker (${{ matrix.id }})
    needs: [plan, benchmark-prepare, docker-external]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.docker_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.docker) }}
    env:
      SYNERGY_CI_SANDBOX_BUNDLE: ${{ needs.plan.outputs.sandbox }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: contains(matrix.tasks, 'native-synergy') || contains(matrix.tasks, 'benchmark-docker-normal') || contains(matrix.tasks, 'benchmark-docker-faults')
        with:
          name: ci-benchmark-prepared-${{ github.run_attempt }}
          path: .artifacts/ci
      - name: Unpack read-only benchmark input
        if: contains(matrix.tasks, 'native-synergy') || contains(matrix.tasks, 'benchmark-docker-normal') || contains(matrix.tasks, 'benchmark-docker-faults')
        shell: bash
        run: tar --zstd -xf .artifacts/ci/benchmark.tar.zst -C .artifacts/ci
      - uses: ./.github/actions/ci-setup
        with:
          dependencies: "false"
          browser: ${{ matrix.browser }}
          desktop: ${{ matrix.desktop }}
          sandbox: ${{ matrix.sandbox }}
          policy: ${{ matrix.policy }}
      - name: Execute planned tasks
        env:
          CI_UNIT: ${{ matrix.id }}
        run: bun script/ci.ts run --unit "$CI_UNIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-${{ matrix.id }}-${{ github.run_attempt }}
          path: .artifacts/ci/results
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Collect bounded benchmark evidence
        if: always()
        run: python3 benchmark/src/synergy_bench/ci_evidence.py integration parent-death compaction-integration oom-integration matrix-integration --output "$RUNNER_TEMP/benchmark-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-evidence-${{ matrix.id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-evidence
          include-hidden-files: true
          retention-days: 7
  postgres:
    name: postgres (${{ matrix.id }})
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.postgres_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.postgres) }}
    env:
      SYNERGY_CI_SANDBOX_BUNDLE: ${{ needs.plan.outputs.sandbox }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: storage-ci-only
          POSTGRES_DB: synergy_storage_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: ./.github/actions/ci-setup
        with:
          dependencies: "true"
          browser: ${{ matrix.browser }}
          desktop: ${{ matrix.desktop }}
          sandbox: ${{ matrix.sandbox }}
          policy: ${{ matrix.policy }}
      - name: Execute planned tasks
        env:
          CI_UNIT: ${{ matrix.id }}
        run: bun script/ci.ts run --unit "$CI_UNIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-${{ matrix.id }}-${{ github.run_attempt }}
          path: .artifacts/ci/results
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  windows:
    name: windows (${{ matrix.id }})
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.windows_count != '0' }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    env:
      SYNERGY_CI_SANDBOX_BUNDLE: ${{ needs.plan.outputs.sandbox }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: ./.github/actions/ci-setup
        with:
          dependencies: "true"
          browser: ${{ matrix.browser }}
          desktop: ${{ matrix.desktop }}
          sandbox: ${{ matrix.sandbox }}
          policy: ${{ matrix.policy }}
      - name: Execute planned tasks
        env:
          CI_UNIT: ${{ matrix.id }}
        run: bun script/ci.ts run --unit "$CI_UNIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-${{ matrix.id }}-${{ github.run_attempt }}
          path: .artifacts/ci/results
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  macos:
    name: macos (${{ matrix.id }})
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.macos_count != '0' }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.macos) }}
    env:
      SYNERGY_CI_SANDBOX_BUNDLE: ${{ needs.plan.outputs.sandbox }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: ./.github/actions/ci-setup
        with:
          dependencies: "true"
          browser: ${{ matrix.browser }}
          desktop: ${{ matrix.desktop }}
          sandbox: ${{ matrix.sandbox }}
          policy: ${{ matrix.policy }}
      - name: Execute planned tasks
        env:
          CI_UNIT: ${{ matrix.id }}
        run: bun script/ci.ts run --unit "$CI_UNIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-${{ matrix.id }}-${{ github.run_attempt }}
          path: .artifacts/ci/results
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  all-checks-passed:
    name: All checks passed
    if: always()
    needs:
      [
        plan,
        prepare,
        benchmark-prepare,
        contracts,
        linux,
        docker-external,
        docker-ready,
        docker,
        postgres,
        windows,
        macos,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci
      - uses: ./.github/actions/ci-setup
        with:
          dependencies: "false"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-results-*-${{ github.run_attempt }}
          merge-multiple: true
          path: .artifacts/ci/results
      - name: Verify completion and current coverage
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bun script/ci.ts verify
      - name: Measure queues and compute time
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_STATE: ${{ github.event_name == 'schedule' && 'cold' || needs.prepare.outputs.cache_hit == 'true' && 'hit' || 'miss' }}
        run: bun script/ci/metrics.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-admission-${{ github.run_attempt }}
          path: .artifacts/ci/admission
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-summary-${{ github.run_attempt }}
          path: |
            .artifacts/ci/summary.json
            .artifacts/ci/metrics.json
          include-hidden-files: true
          retention-days: 30
