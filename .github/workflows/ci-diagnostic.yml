name: CI diagnostics
on:
  workflow_dispatch:
    inputs:
      task:
        description: Comma separated task IDs
        type: string
      package:
        description: Workspace directory
        type: string
      file:
        description: Repository relative test file
        type: string
permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  HUSKY: "0"
  FORCE_COLOR: "1"

jobs:
  plan:
    name: Verification plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      mode: ${{ steps.plan.outputs.mode }}
      build: ${{ steps.plan.outputs.build }}
      sandbox: ${{ steps.plan.outputs.sandbox }}
      benchmark: ${{ steps.plan.outputs.benchmark }}
      linux: ${{ steps.plan.outputs.linux }}
      linux_count: ${{ steps.plan.outputs.linux_count }}
      docker: ${{ steps.plan.outputs.docker }}
      docker_count: ${{ steps.plan.outputs.docker_count }}
      postgres: ${{ steps.plan.outputs.postgres }}
      postgres_count: ${{ steps.plan.outputs.postgres_count }}
      windows: ${{ steps.plan.outputs.windows }}
      windows_count: ${{ steps.plan.outputs.windows_count }}
      diagnostic: ${{ steps.plan.outputs.diagnostic }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - name: Select diagnostic tasks
        id: plan
        env:
          TASK: ${{ inputs.task }}
          PACKAGE: ${{ inputs.package }}
          FILE: ${{ inputs.file }}
        run: |
          args=(--mode diagnostic)
          if [ -n "$TASK" ]; then args+=(--only "$TASK"); fi
          if [ -n "$PACKAGE" ]; then args+=(--package "$PACKAGE"); fi
          if [ -n "$FILE" ]; then args+=(--file "$FILE"); fi
          bun script/ci.ts plan "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci/plan.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  prepare:
    name: Verified Linux build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SYNERGY_CI_SANDBOX_BUNDLE: ${{ needs.plan.outputs.sandbox }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - name: Resolve build toolchain identity
        id: build-key
        run: bun script/ci.ts build-key
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        if: github.event_name != 'schedule'
        with:
          path: .artifacts/ci/build
          key: ci-build-${{ steps.build-key.outputs.key }}
      - name: Build or validate cached outputs
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            bun script/ci.ts restore
          else
            bun script/ci.ts prepare
          fi
          tar -cf .artifacts/ci/build.tar -C .artifacts/ci build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-build-${{ github.run_attempt }}
          path: .artifacts/ci/build.tar
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  benchmark-prepare:
    name: Frozen benchmark preparation
    needs: plan
    if: needs.plan.outputs.benchmark == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci
      - uses: ./.github/actions/ci-setup
        with:
          dependencies: "false"
      - run: bun script/ci.ts run --unit benchmark-prepare
      - run: tar -I 'zstd -T2 -3' -cf .artifacts/ci/benchmark.tar.zst -C .artifacts/ci benchmark/prepared
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-benchmark-prepared-${{ github.run_attempt }}
          path: .artifacts/ci/benchmark.tar.zst
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-benchmark-prepare-${{ github.run_attempt }}
          path: .artifacts/ci/results
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  execute:
    name: Diagnostic (${{ matrix.id }})
    needs: [plan, prepare, benchmark-prepare]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.diagnostic) }}
    env:
      SYNERGY_CI_SANDBOX_BUNDLE: ${{ needs.plan.outputs.sandbox }}
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: storage-ci-only
          POSTGRES_DB: synergy_storage_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .artifacts/ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.build
        with:
          name: ci-build-${{ github.run_attempt }}
          path: .artifacts/ci
      - name: Verify shared build
        if: matrix.build
        shell: bash
        run: |
          tar -xf .artifacts/ci/build.tar -C .artifacts/ci
          bun script/ci.ts restore
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.pool == 'docker' && needs.plan.outputs.benchmark == 'true'
        with:
          name: ci-benchmark-prepared-${{ github.run_attempt }}
          path: .artifacts/ci
      - name: Unpack read-only benchmark input
        if: matrix.pool == 'docker' && needs.plan.outputs.benchmark == 'true'
        shell: bash
        run: tar --zstd -xf .artifacts/ci/benchmark.tar.zst -C .artifacts/ci
      - uses: ./.github/actions/ci-setup
        with:
          dependencies: ${{ matrix.pool != 'docker' }}
          browser: ${{ matrix.browser }}
          desktop: ${{ matrix.desktop }}
          sandbox: ${{ matrix.sandbox }}
          policy: ${{ matrix.policy }}
      - name: Execute diagnostic selection
        env:
          CI_UNIT: ${{ matrix.id }}
        run: bun script/ci.ts run --unit "$CI_UNIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-${{ matrix.id }}-${{ github.run_attempt }}
          path: .artifacts/ci/results
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
