name: Workspace Native Path Probe
on:
  push:
    branches: [synergy/workspace-c]
    paths:
      - .github/workflows/workspace-path-probe.yml
      - test/script/windows-snapshot-path-probe.ts
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Measure shared Workspace snapshot completion in fresh processes
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            bun test --timeout 90000 test/workspace/change-attribution.test.ts --test-name-pattern 'explicitly shared'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        working-directory: packages/runtime-local
      - run: bun test --timeout 60000 test/workspace-file/snapshot-links.test.ts
        working-directory: packages/runtime-local
      - if: always()
        run: bun test test/cli/data-files.test.ts
        working-directory: packages/cli
      - if: always()
        run: bun test --timeout 60000 test/cli/data-workspace-move.test.ts test/cli/data-transfer.test.ts
        working-directory: packages/product-runtime
