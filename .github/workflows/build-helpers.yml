name: Build Native Runtime Assets

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - ".github/workflows/build-helpers.yml"
      - "packages/local-runtime/src/sandbox/helper-linux/**"
      - "packages/local-runtime/src/sandbox/helper/**"
      - "packages/local-runtime/script/build-helper.ts"
      - "packages/local-runtime/script/build-watcher.ts"
      - "packages/local-runtime/script/build-pty.ts"
      - "packages/local-runtime/src/process/native-pty/**"
      - "packages/util/src/native-assets.ts"
      - "script/release/shared/native-package.ts"
      - "packages/local-runtime/script/watcher/**"
      - "packages/local-runtime/test/file/fixtures/watcher-*"
      - "test/script/watcher-native.test.ts"
      - "packages/harness/script/build-sqlite.ts"
      - "packages/harness/src/storage/sqlite-engine.ts"
      - "script/pack-workspace.ts"
      - "script/build-workspace.ts"
      - "test/script/release/workspace-sqlite.test.ts"
  push:
    branches: [dev, main]
    paths:
      - ".github/workflows/build-helpers.yml"
      - "packages/local-runtime/src/sandbox/helper-linux/**"
      - "packages/local-runtime/src/sandbox/helper/**"
      - "packages/local-runtime/script/build-helper.ts"
      - "packages/local-runtime/script/build-watcher.ts"
      - "packages/local-runtime/script/build-pty.ts"
      - "packages/local-runtime/src/process/native-pty/**"
      - "packages/util/src/native-assets.ts"
      - "script/release/shared/native-package.ts"
      - "packages/local-runtime/script/watcher/**"
      - "packages/local-runtime/test/file/fixtures/watcher-*"
      - "test/script/watcher-native.test.ts"
      - "packages/harness/script/build-sqlite.ts"
      - "packages/harness/src/storage/sqlite-engine.ts"
      - "script/pack-workspace.ts"
      - "script/build-workspace.ts"
      - "test/script/release/workspace-sqlite.test.ts"

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }} native assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
            gnu_target: x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
          - arch: arm64
            os: ubuntu-24.04-arm
            gnu_target: aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.gnu_target }},${{ matrix.musl_target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build and stage Linux helpers
        shell: bash
        run: |
          bun run packages/local-runtime/script/build-helper.ts linux --target "${{ matrix.gnu_target }}"
          bun run packages/local-runtime/script/build-helper.ts linux --target "${{ matrix.musl_target }}"
          mkdir -p \
            "packages/local-runtime/sandbox-assets/linux-${{ matrix.arch }}" \
            "packages/local-runtime/sandbox-assets/linux-${{ matrix.arch }}-musl"
          cp \
            "packages/local-runtime/src/sandbox/helper-linux/target/${{ matrix.gnu_target }}/release/synergy-sandbox-linux" \
            "packages/local-runtime/sandbox-assets/linux-${{ matrix.arch }}/synergy-sandbox-linux"
          cp \
            "packages/local-runtime/src/sandbox/helper-linux/target/${{ matrix.musl_target }}/release/synergy-sandbox-linux" \
            "packages/local-runtime/sandbox-assets/linux-${{ matrix.arch }}-musl/synergy-sandbox-linux"
          chmod 755 packages/local-runtime/sandbox-assets/linux-*/synergy-sandbox-linux

      - name: Build verified Linux watcher bindings
        run: |
          bun install --frozen-lockfile
          bun packages/local-runtime/script/build-watcher.ts --arch "${{ matrix.arch }}"
          bun packages/local-runtime/script/build-watcher.ts --arch "${{ matrix.arch }}" --libc musl
      - name: Build Linux PTY libraries
        run: |
          bun packages/local-runtime/script/build-pty.ts --arch "${{ matrix.arch }}"
          bun packages/local-runtime/script/build-pty.ts --arch "${{ matrix.arch }}" --libc musl
      - name: Upload Linux PTY libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pty-assets-linux-${{ matrix.arch }}
          path: packages/local-runtime/.artifacts/pty
          include-hidden-files: true
          if-no-files-found: error
      - name: Verify watcher coexistence with ONNX and signal recovery in Bun
        run: bun test --config /dev/null test/script/watcher-native.test.ts
      - name: Upload Linux watcher bindings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watcher-assets-linux-${{ matrix.arch }}
          path: packages/local-runtime/.artifacts/watcher
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload Linux sandbox assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandbox-assets-linux-${{ matrix.arch }}
          path: packages/local-runtime/sandbox-assets
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }} native assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: Build and stage Windows helper
        shell: bash
        run: |
          bun run packages/local-runtime/script/build-helper.ts windows --target "${{ matrix.target }}"
          mkdir -p packages/local-runtime/sandbox-assets/windows-${{ matrix.arch }}
          cp \
            packages/local-runtime/src/sandbox/helper/target/${{ matrix.target }}/release/synergy-sandbox-windows.exe \
            packages/local-runtime/sandbox-assets/windows-${{ matrix.arch }}/synergy-sandbox-windows.exe

      - name: Upload Windows sandbox assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandbox-assets-windows-${{ matrix.arch }}
          path: packages/local-runtime/sandbox-assets
          if-no-files-found: error

      - name: Build Windows PTY library
        run: bun packages/local-runtime/script/build-pty.ts --arch "${{ matrix.arch }}"
      - name: Upload Windows PTY library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pty-assets-windows-${{ matrix.arch }}
          path: packages/local-runtime/.artifacts/pty
          include-hidden-files: true
          if-no-files-found: error

  macos:
    name: macOS SQLite and PTY libraries
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - run: bun packages/harness/script/build-sqlite.ts
      - run: bun install --frozen-lockfile
      - name: Verify packaged SQLite without host libraries
        run: bun test --config /dev/null test/script/release/workspace-sqlite.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sqlite-assets-darwin
          path: packages/harness/.artifacts/sqlite/
          if-no-files-found: error
      - name: Build macOS PTY libraries
        run: |
          bun packages/local-runtime/script/build-pty.ts --arch x64
          bun packages/local-runtime/script/build-pty.ts --arch arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pty-assets-darwin
          path: packages/local-runtime/.artifacts/pty
          include-hidden-files: true
          if-no-files-found: error
