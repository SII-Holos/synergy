name: CI final metrics
on:
  # Read-only collector executes default-branch code and never consumes PR code or artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Collect completed attempt metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CI_MEASURE_RUN: ${{ github.event.workflow_run.id }}
          CI_MEASURE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: bun script/ci/metrics.ts --run "$CI_MEASURE_RUN" --attempt "$CI_MEASURE_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-final-metrics-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: .artifacts/ci/metrics.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
