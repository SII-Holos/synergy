version: 2
suite: ../suites/local-24.json
output: ../../.artifacts/benchmark/qwen38-acceptance-v2
cache: ../../.artifacts/benchmark/cache
platform: linux/amd64
seed: 20260919
repeat: 1
concurrency: auto
task_repeats:
  terminal-bench-2.1/openssl-selfsigned-cert: 3
  terminal-bench-2.1/polyglot-c-py: 3
selection:
  tasks:
    - terminal-bench-2.1/build-cython-ext
    - terminal-bench-2.1/large-scale-text-editing
    - terminal-bench-2.1/openssl-selfsigned-cert
    - terminal-bench-2.1/polyglot-c-py
    - deepswe-1.1/dasel-html-document-format
    - deepswe-1.1/fd-deterministic-multi-key-sorting
harnesses:
  synergy-think:
    kind: synergy
    source:
      path: ../..
    runtime: core
    merge_system_messages: true
  synergy-nothink:
    kind: synergy
    source:
      path: ../..
    runtime: core
    merge_system_messages: true
  codex:
    kind: codex
    package_version: 0.154.0
  opencode:
    kind: opencode
    package_version: 1.15.13
  pi:
    kind: pi
    package_version: 0.85.1
  deepseek:
    kind: deepseek
    package_version: 0.1.5-rc.1
models:
  qwen38:
    model: Qwen3.8-27B
    protocol: chat-completions
    base_url: https://cqhbod8bjjjbcoakk8pmeebgkaq9akcq.openapi-sj.sii.edu.cn/v1
    api_key_env: INF_API_KEY
    context_window: 262144
    max_output_tokens: 65536
    supports_developer_role: false
    merge_system_messages: true
    parameters:
      temperature: 0.6
      top_p: 0.95
      thinking:
        type: enabled
        clear_thinking: false
  qwen38-nothink:
    model: Qwen3.8-27B
    protocol: chat-completions
    base_url: https://cqhbod8bjjjbcoakk8pmeebgkaq9akcq.openapi-sj.sii.edu.cn/v1
    api_key_env: INF_API_KEY
    context_window: 262144
    max_output_tokens: 65536
    supports_developer_role: false
    merge_system_messages: true
    parameters:
      temperature: 0.6
      top_p: 0.95
      thinking:
        type: enabled
        clear_thinking: false
      chat_template_kwargs:
        enable_thinking: false
matrix:
  include:
    - harness: synergy-think
      model: qwen38
    - harness: synergy-nothink
      model: qwen38-nothink
    - harness: codex
      model: qwen38
    - harness: opencode
      model: qwen38
    - harness: pi
      model: qwen38
    - harness: deepseek
      model: qwen38
