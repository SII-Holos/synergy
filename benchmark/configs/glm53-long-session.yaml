  opencode-jitless:
    kind: opencode
    package_version: 1.15.13
    bun_jit: false
  pi:
    kind: pi
    package_version: 0.85.1
  deepseek:
    kind: deepseek
    package_version: 0.1.5-rc.1
models:
  glm53flash-max:
    model: glm-5.3-flash
