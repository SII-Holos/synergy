version: 2
suite: ../suites/local-24.json
output: ../../.artifacts/benchmark/long-session
cache: ../../.artifacts/benchmark/cache
platform: linux/amd64
seed: 20260914
repeat: 1
concurrency: auto
timeout_seconds: 10800
preparation_timeout_seconds: 7200
task_repeats:
  terminal-bench-2.1/openssl-selfsigned-cert: 3
  terminal-bench-2.1/polyglot-c-py: 3
selection:
  tasks:
    - terminal-bench-2.1/build-cython-ext
