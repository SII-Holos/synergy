<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520"><rect width="1120" height="520" fill="#f7f7f5"/><text x="56" y="58" font-family="Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#20201e">Focus + motion</text><text x="56" y="88" font-family="Segoe UI,sans-serif" font-size="15" fill="#6d6d68">PR 11 · keyboard clarity and calm reduced-motion mode</text><g transform="translate(56 126)"><rect width="454" height="320" rx="16" fill="#fff" stroke="#deded8"/><text x="26" y="34" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#8a8a83">BEFORE</text><rect x="28" y="70" width="398" height="52" rx="10" fill="#f1f1ee"/><rect x="46" y="84" width="130" height="24" rx="7" fill="#fff"/><rect x="196" y="84" width="86" height="24" rx="7" fill="#fff"/><text x="28" y="292" font-family="Segoe UI,sans-serif" font-size="14" fill="#8a8a83">Keyboard focus is easy to lose.</text></g><g transform="translate(610 126)"><rect width="454" height="320" rx="16" fill="#fff" stroke="#deded8"/><text x="26" y="34" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#4b4b46">AFTER</text><rect x="28" y="70" width="398" height="52" rx="10" fill="#f1f1ee"/><rect x="46" y="84" width="130" height="24" rx="7" fill="#fff" stroke="#3978c8" stroke-width="2"/><rect x="196" y="84" width="86" height="24" rx="7" fill="#fff"/><text x="28" y="292" font-family="Segoe UI,sans-serif" font-size="14" fill="#6d6d68">Focus remains visible; motion can stop.</text></g></svg>
