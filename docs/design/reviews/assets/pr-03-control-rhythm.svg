<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="1100" height="560" fill="#f6f7f9"/><style>.t{font:700 25px Segoe UI;fill:#172033}.s{font:500 15px Segoe UI;fill:#66738a}.b{font:600 15px Segoe UI;fill:#24324a}.btn{fill:#fff;stroke:#d7dee8}.primary{fill:#263247}.pt{font:600 14px Segoe UI;fill:#fff}.note{font:500 13px Segoe UI;fill:#526074}</style>
<text x="48" y="48" class="t">PR 03 · Control rhythm</text><text x="48" y="75" class="s">紧凑按钮和图标按钮从 22/24px 收敛到 24/28px/32px 节奏</text>
<rect x="48" y="112" width="480" height="370" rx="16" fill="#fff" stroke="#dfe4eb"/><rect x="572" y="112" width="480" height="370" rx="16" fill="#fff" stroke="#d4dae3"/>
<text x="76" y="153" class="t">Before</text><text x="76" y="179" class="s">控件过紧，工具栏基线不统一</text><rect x="76" y="226" width="62" height="22" rx="6" class="btn"/><text x="88" y="241" class="b">取消</text><rect x="150" y="225" width="92" height="24" rx="6" class="primary"/><text x="165" y="241" class="pt">运行任务</text><rect x="254" y="225" width="24" height="24" rx="5" class="btn"/><text x="261" y="242" class="b">⋯</text><text x="76" y="300" class="note">small 22px · normal 24px · icon 24px</text>
<text x="600" y="153" class="t">After</text><text x="600" y="179" class="s">可点击区域更舒服，常用动作更易扫描</text><rect x="600" y="223" width="68" height="24" rx="6" class="btn"/><text x="614" y="239" class="b">取消</text><rect x="680" y="221" width="104" height="28" rx="6" class="primary"/><text x="697" y="239" class="pt">运行任务</text><rect x="796" y="221" width="28" height="28" rx="6" class="btn"/><text x="804" y="240" class="b">⋯</text><text x="600" y="300" class="note">small 24px · normal 28px · icon 28px · large 32px</text>
<line x1="76" y1="370" x2="500" y2="370" stroke="#e2e6ec"/><line x1="600" y1="370" x2="1024" y2="370" stroke="#e2e6ec"/><text x="76" y="405" class="s">目标：不改变操作语义，只消除“按钮挤在一起”的廉价感</text><text x="600" y="405" class="s">目标：让文字按钮和图标按钮共享同一视觉基线</text>
</svg>
